# Truck Transport Company Software — Docker Compose
# Author: Imran Ahmed <me@imrandev.bd> — https://imrandev.bd/contact

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: imrandevbd/truck-transport-company-software:latest
    container_name: truck-transport-company-software-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "Truck Transport Company Software"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:-}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-truck_transport_company_software}"
      DB_USERNAME: "${DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      AUTHOR_NAME: "Imran Ahmed"
      AUTHOR_EMAIL: "me@imrandev.bd"
      AUTHOR_WEBSITE: "https://imrandev.bd"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: truck-transport-company-software-mysql
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-truck_transport_company_software}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootsecret}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
